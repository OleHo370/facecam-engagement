<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Class Meet</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="landing">
    <h1>Class Meet</h1>
    <input id="name" placeholder="Your name" autocomplete="off" />

    <button id="create">Create meeting (you'll be the teacher)</button>

    <div class="join-row">
      <input id="room-code" placeholder="Meeting code" autocomplete="off" />
      <button id="join">Join meeting</button>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
